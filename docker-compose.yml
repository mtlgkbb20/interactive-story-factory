services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: story_factory
      POSTGRES_USER: story_factory
      POSTGRES_PASSWORD: story_factory_local
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story_factory -d story_factory"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://story_factory:story_factory_local@db:5432/story_factory
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
volumes:
  postgres_data:
