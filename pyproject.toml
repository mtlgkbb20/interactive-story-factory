[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-story-factory"
version = "0.1.0"
description = "Audience-directed AI short-form story production pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "pydantic>=2.6,<3.0", "pydantic-settings>=2.2,<3.0", "sqlalchemy>=2.0,<3.0", "httpx>=0.27,<1.0", "psycopg[binary]>=3.1,<4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "pytest-cov>=5.0,<7.0", "ruff>=0.4,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]